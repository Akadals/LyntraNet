name: Sync LyntraNet to Internal Template

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LyntraNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout Template
        uses: actions/checkout@v4
        with:
          repository: Akadals/Latency-Native-Transport-Networks
          ref: main
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          path: template
          fetch-depth: 1

      - name: Sync Files
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='TemplateOnly/' \
            ./ template/

      - name: Commit and Push
        working-directory: template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Sync from LyntraNet"
          git push origin main